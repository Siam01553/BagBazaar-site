
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BagBazaar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .container {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .product {
      background: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem;
      width: 300px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 4px;
    }
    .product h3 {
      margin: 0.5rem 0;
    }
    .product button {
      background: #d35400;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .product button:hover {
      background: #e67e22;
    }
  </style>
</head>
<body>
  <header>
    <h1>BagBazaar</h1>
    <p>Premium Quality Handbags at Affordable Price</p>
  </header>

  <div class="container">
    <div class="product">
      <img src="brown-bag.jpg" alt="Brown Bag">
      <h3>Luxury Brown Leather Bag</h3>
      <p>Price: ৳1650</p>
      <button onclick="orderNow('Luxury Brown Leather Bag')">Order Now</button>
    </div>
    <div class="product">
      <img src="black-bag.jpg" alt="Black Bag">
      <h3>Classic Black Leather Bag</h3>
      <p>Price: ৳1650</p>
      <button onclick="orderNow('Classic Black Leather Bag')">Order Now</button>
    </div>
  </div>

  <script>
    function orderNow(bagName) {
      alert('To order "' + bagName + '", please message us on Facebook or inbox BagBazaar now!');
    }
  </script>
</body>
</html>
